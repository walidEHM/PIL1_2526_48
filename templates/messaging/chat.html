<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex align-items-center">
                    <i class="bi bi-chat-dots-fill me-2"></i>
                    <strong>Conversation</strong>
                    <a href="{% url 'messaging:liste_conversations' %}"
                       class="btn btn-sm btn-light ms-auto">
                        ← Retour
                    </a>
                </div>
                <div class="card-body" id="zone-messages"
                     style="height:400px; overflow-y:auto; background:#f8f9fa;">
                    {% for message in messages %}
                    <div class="d-flex mb-3 {% if message.expediteur == request.user %}justify-content-end{% endif %}">
                        <div class="p-3 rounded-3 {% if message.expediteur == request.user %}bg-primary text-white{% else %}bg-white border{% endif %}"
                             style="max-width:70%;">
                            <p class="mb-1">{{ message.contenu }}</p>
                            <small class="{% if message.expediteur == request.user %}text-white-50{% else %}text-muted{% endif %}">
                                {{ message.expediteur.username }} — {{ message.date_envoi|date:"H:i" }}
                            </small>
                        </div>
                    </div>
                    {% empty %}
                    <p class="text-center text-muted mt-4">
                        Aucun message. Commencez la conversation !
                    </p>
                    {% endfor %}
                </div>
                <div class="card-footer">
                    <div class="input-group">
                        <input type="text" id="input-message"
                               class="form-control"
                               placeholder="Écris ton message..."
                               autocomplete="off">
                        <button class="btn btn-primary" id="btn-envoyer">
                            <i class="bi bi-send-fill"></i> Envoyer
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const zone = document.getElementById('zone-messages');
    zone.scrollTop = zone.scrollHeight;
    const conversationId = {{ conversation.id }};
    const csrfToken = '{{ csrf_token }}';

    function envoyerMessage() {
        const input = document.getElementById('input-message');
        const contenu = input.value.trim();
        if (!contenu) return;
        fetch(`/messaging/${conversationId}/envoyer/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({ contenu: contenu })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const div = document.createElement('div');
                div.className = 'd-flex mb-3 justify-content-end';
                div.innerHTML = `
                    <div class="p-3 rounded-3 bg-primary text-white" style="max-width:70%;">
                        <p class="mb-1">${data.message.contenu}</p>
                        <small class="text-white-50">
                            ${data.message.expediteur} — ${data.message.date_envoi}
                        </small>
                    </div>`;
                zone.appendChild(div);
                zone.scrollTop = zone.scrollHeight;
                input.value = '';
            }
        });
    }

    document.getElementById('btn-envoyer').addEventListener('click', envoyerMessage);
    document.getElementById('input-message').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') envoyerMessage();
    });
</script>
</body>
</html>
